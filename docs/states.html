<!doctype html><meta charset="utf-8">
<!-- Source for docs/states.png. Regenerate with docs/build.sh.
     Proportions mirror a real macOS menu bar: 24pt bar, 22pt status icons, and
     dropdowns centred under their icon, each only as wide as its single row.
     The three states sit side by side; in reality only one menu opens at once. -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:13px/1.35 -apple-system,"SF Pro Text","Helvetica Neue",sans-serif;
       background:#eceef1;-webkit-font-smoothing:antialiased;padding:14px 0 0}

  .bar{height:24px;background:linear-gradient(180deg,#bed8f1,#b0cfeb);
       display:flex;align-items:center;justify-content:center;padding-right:62px}
  .bar img{width:22px;height:22px;display:block}
  .ours{position:relative;display:block}

  /* NSMenu: centred on the icon, hairline border, sized to its content */
  .menu{position:absolute;top:25px;left:50%;transform:translateX(-50%);
        background:rgba(250,250,251,.98);border:.5px solid rgba(0,0,0,.18);
        border-radius:5px;padding:3px;box-shadow:0 6px 16px rgba(0,0,0,.2);
        white-space:nowrap;z-index:5}
  .mi{font-size:12.5px;line-height:17px;padding:0 10px 0 4px;border-radius:3px;color:#1d1d1f}
  .tick{display:inline-block;width:13px;color:#1d1d1f}
  .off .tick{color:transparent}
  .warn .mi{color:#c0362c}
</style>

<div class="bar">
  <span class="ours" style="margin-right:100px"><img src="../icons/busy.png">
    <span class="menu"><span class="mi"><span class="tick">✓</span>Awake</span></span>
  </span>

  <span class="ours off" style="margin-right:160px"><img src="../icons/sleep.png">
    <span class="menu"><span class="mi"><span class="tick">✓</span>Awake</span></span>
  </span>

  <span class="ours warn"><img src="../icons/warn.png">
    <span class="menu"><span class="mi"><span class="tick"></span>Not authorised — run install.sh</span></span>
  </span>
</div>
